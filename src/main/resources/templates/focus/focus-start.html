<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>훈련 시작 | FocusTrainer</title>
    <link rel="stylesheet" th:href="@{/css/focus-start.css}">
</head>
<body>
<div class="container">
    <h1>집중력 훈련</h1>

    <div id="trainingSection">
        <video id="cameraView" autoplay playsinline></video>

        <div class="timer-display" id="timer">00:00:00</div>

        <div class="button-group">
            <button id="startBtn" class="primary-btn">시작하기</button>
            <button id="stopBtn" class="secondary-btn" disabled>종료하기</button>
        </div>

        <div id="resultSection" style="display:none;">
            <h3>집중력 분석 결과</h3>
            <p id="focusResult">분석 중...</p>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const initMinutes = [[${minutes}]] || 0;
</script>
<script th:src="@{/js/focus-start.js}" defer></script>
</body>
</html>
